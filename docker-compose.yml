# The whole application, or just its database.
#
#   docker compose up --build        build and run everything, then open
#                                    http://localhost:3000
#   docker compose up -d postgres    database only, for `npm run dev` and `npm test`
#   docker compose down              stop, keeping data
#   docker compose down -v           stop and delete the data, so the next start
#                                    seeds the catalogue again
#
# Docker also avoids a host Postgres install: on the machine this was built on,
# /opt/homebrew is owned by another account, and Docker needs no elevated
# permission.
services:
  postgres:
    image: postgres:17-alpine
    container_name: declutter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: declutter
      POSTGRES_PASSWORD: declutter
      POSTGRES_DB: declutter
    ports:
      - "5432:5432"
    volumes:
      - declutter-pgdata:/var/lib/postgresql/data
      # Creates declutter_test for the test suite, on a fresh volume only.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U declutter -d declutter"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: declutter-app
    restart: unless-stopped
    environment:
      # Inside the compose network the database is reached by service name.
      DATABASE_URL: postgresql://declutter:declutter@postgres:5432/declutter?schema=public
      DIRECT_URL: postgresql://declutter:declutter@postgres:5432/declutter?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  declutter-pgdata:
